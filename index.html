---
layout: default
title: 首页
---
<ul class="post-list">
{% for post in site.posts %}
  <li>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</p>
    <div class="post-excerpt">{{ post.excerpt }}</div>
  </li>
{% endfor %}
</ul>
